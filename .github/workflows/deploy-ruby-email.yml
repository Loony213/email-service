name: Deploy Email Service to EC2

on:
  push:
    branches:
      - test  

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    
    - name: Set up SSH key for EC2
      uses: webfactory/ssh-agent@v0.5.3
      with:
        ssh-private-key: ${{ secrets.EC2_PEM_KEY }}

    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Build Docker images services
      run: |
        docker build -t kamartinez/change_password ./change_password
        docker build -t kamartinez/change_user ./change_user
        docker build -t kamartinez/delete-account ./delete_account
        docker build -t kamartinez/description ./description

    - name: Push images to Docker Hub
      run: |
        docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
        docker push kamartinez/change_password
        docker push kamartinez/change_user
        docker push kamartinez/delete-account
        docker push kamartinez/description

    - name: Deploy services to EC2
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: 54.145.79.10 
        username: ec2-user
        key: ${{ secrets.EC2_PEM_KEY }}
        script: |
          # Detener y eliminar contenedores anteriores si existen
          docker stop change_password || true
          docker rm change_password || true
          docker stop change_user || true
          docker rm change_user || true
          docker stop delete-account || true
          docker rm delete-account || true
          docker stop description || true
          docker rm description || true

          # Descargar las últimas imágenes de Docker
          docker pull kamartinez/change_password
          docker pull kamartinez/change_user
          docker pull kamartinez/delete-account
          docker pull kamartinez/description

          # Ejecutar los nuevos contenedores con las imágenes más recientes
          docker run -d --name change_password -p 4567:4567 kamartinez/change_password
          docker run -d --name change_user -p 4568:4568 kamartinez/change_user
          docker run -d --name delete-account -p 4569:4569 kamartinez/delete-account
          docker run -d --name description -p 4566:4566 kamartinez/description